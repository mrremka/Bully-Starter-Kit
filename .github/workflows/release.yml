name: Build release ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project
        shell: powershell
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -match '-(alpha|beta|rc)([.-]|$)' -or '${{ github.event_name }}' -eq 'workflow_dispatch') {
            .\scripts\Test-Project.ps1
          } else {
            .\scripts\Test-Project.ps1 -Release
          }

      - name: Test CMD launcher
        shell: cmd
        run: Start_BullyStarterKit.bat --launcher-test

      - name: Package release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $items = @(
            'Start_BullyStarterKit.bat',
            'src',
            'locales',
            'assets',
            'mods.json',
            'README.md',
            'README_EN.md',
            'THIRD_PARTY.md',
            'CHANGELOG.md',
            'RELEASE_NOTES.md',
            'CONTRIBUTING.md',
            'CONTRIBUTING_RU.md',
            'SECURITY.md',
            'LICENSE',
            'docs',
            'scripts',
            'downloads'
          )
          Compress-Archive -Path $items -DestinationPath release/BullyStarterKit.zip -Force
          (Get-FileHash release/BullyStarterKit.zip -Algorithm SHA256).Hash + '  BullyStarterKit.zip' | Set-Content release/BullyStarterKit.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BullyStarterKit
          path: |
            release/BullyStarterKit.zip
            release/BullyStarterKit.sha256

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            release/BullyStarterKit.zip
            release/BullyStarterKit.sha256
