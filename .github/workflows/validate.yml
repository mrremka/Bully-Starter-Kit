name: Validate project

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell, JSON and localization
        shell: powershell
        run: .\scripts\Test-Project.ps1

      - name: Test CMD launcher
        shell: cmd
        run: Start_BullyStarterKit.bat --launcher-test
