name: "Feature / Идея"
description: "Предложить улучшение установщика или набора / Suggest an improvement."
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: "Что добавить или улучшить? / What should be added or improved?"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Зачем это нужно? / Why would it improve the starter experience?"
  - type: input
    id: source
    attributes:
      label: "Официальная ссылка (если это мод) / Official source link (for mod requests)"
      placeholder: "https://..."
